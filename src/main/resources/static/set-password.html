<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Paneli - Şifre Belirleme</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React 18 & Babel & Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(59, 130, 246, 0.3);
            --primary: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 44px 38px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.15);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { text-align: center; margin-bottom: 28px; }

        .icon-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }

        .header h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p { font-size: 13px; color: var(--text-sub); }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 600;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 600;
        }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
        
        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus { border-color: var(--primary); }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script src="/js/api/apiClient.js"></script>
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        function SetPasswordApp() {
            const [token, setToken] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const tokenParam = params.get('token');
                const emailParam = params.get('email');
                if (emailParam) {
                    setToken(emailParam);
                } else if (tokenParam) {
                    setToken(tokenParam);
                } else {
                    setError('Geçersiz bağlantı. Kullanıcı bilgisi veya jeton bulunamadı.');
                }
                setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setSuccessMsg('');

                if (password.length < 6) {
                    setError('Şifre en az 6 karakter olmalıdır.');
                    return;
                }

                if (password !== confirmPassword) {
                    setError('Şifreler eşleşmiyor.');
                    return;
                }

                setLoading(true);

                try {
                    const data = await window.ApiClient.post('/api/v1/user/set-password', { token, email: token, password });
                    if (data.success) {
                        setSuccessMsg('Şifreniz Keycloak üzerinde güvenle oluşturuldu.');
                    }
                } catch (err) {
                    setError(err.message || 'İşlem gerçekleştirilemedi.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="card">
                    <div className="header">
                        <div className="icon-box">
                            <i data-lucide="key-round" style={{width: '32px', height: '32px', color: 'white'}}></i>
                        </div>
                        <h2>Şifre Oluştur</h2>
                        <p>Hesabınız için yeni şifre belirleyin</p>
                    </div>

                    {error && <div className="alert-error">{error}</div>}
                    {successMsg && (
                        <div>
                            <div className="alert-success">{successMsg}</div>
                            <a href="/user-login.html" className="btn-submit">Giriş Yap →</a>
                        </div>
                    )}

                    {!successMsg && (
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">Yeni Şifre</label>
                                <input 
                                    type="password" 
                                    className="input-field" 
                                    placeholder="En az 6 karakter" 
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required 
                                    autoFocus
                                />
                            </div>

                            <div className="form-group">
                                <label className="form-label">Şifre Tekrarı</label>
                                <input 
                                    type="password" 
                                    className="input-field" 
                                    placeholder="Şifrenizi tekrar girin" 
                                    value={confirmPassword}
                                    onChange={(e) => setConfirmPassword(e.target.value)}
                                    required 
                                />
                            </div>

                            <button type="submit" className="btn-submit" disabled={loading}>
                                {loading ? 'Şifre Kaydediliyor...' : 'Şifreyi Kaydet & Tamamla'}
                            </button>
                        </form>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<SetPasswordApp />);
    </script>
</body>
</html>
