<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Girişi - e-Belge Duyuru Takip</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/auth.css">

    <!-- React 18 & Babel & Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; padding: 20px;">

    <div id="root"></div>

    <!-- API Client & Services -->
    <script src="/js/api/apiClient.js"></script>
    <script src="/js/services/authService.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function UserLoginApp() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 50);
                const sessionMessage = sessionStorage.getItem('sessionExpiredMessage');
                if (sessionMessage) {
                    setError(sessionMessage);
                    sessionStorage.removeItem('sessionExpiredMessage');
                }
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    await window.AuthService.loginUser(email, password);
                    window.location.href = '/user-dashboard.html';
                } catch (err) {
                    setError(err.message || 'E-posta veya şifre hatalı.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="login-card">
                    <div className="login-header">
                        <div className="login-icon-box" style={{ background: 'linear-gradient(135deg, #06b6d4, #3b82f6)' }}>
                            <i data-lucide="user-check" style={{ width: '32px', height: '32px', color: 'white' }}></i>
                        </div>
                        <h2>Kullanıcı Girişi</h2>
                        <p>Duyuru Takip Portalına Hoş Geldiniz</p>
                    </div>

                    {error && <div className="login-error">{error}</div>}

                    <form onSubmit={handleLogin}>
                        <div className="form-group">
                            <label className="form-label">E-posta Adresi</label>
                            <input 
                                type="email" 
                                className="input-field" 
                                placeholder="E-posta adresiniz" 
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                required 
                                autoFocus
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">Şifre</label>
                            <input 
                                type="password" 
                                className="input-field" 
                                placeholder="••••••••" 
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                required 
                            />
                        </div>

                        <button type="submit" className="btn-submit" style={{ background: 'linear-gradient(135deg, #06b6d4, #3b82f6)' }} disabled={loading}>
                            {loading ? 'Giriş Yapılıyor...' : 'Giriş Yap'}
                        </button>
                    </form>

                    <div style={{ marginTop: '24px', paddingTop: '20px', borderTop: '1px solid rgba(255,255,255,0.08)', textAlign: 'center' }}>
                        <p style={{ fontSize: '13px', color: 'var(--text-sub)', marginBottom: '12px' }}>Yönetici Paneline Gitmek İster misiniz?</p>
                        <a 
                            href="/admin-login.html" 
                            style={{
                                display: 'inline-flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                gap: '8px',
                                width: '100%',
                                background: 'rgba(139, 92, 246, 0.1)',
                                border: '1px solid rgba(139, 92, 246, 0.3)',
                                color: '#c084fc',
                                padding: '12px',
                                borderRadius: '10px',
                                fontSize: '13px',
                                fontWeight: '600',
                                textDecoration: 'none',
                                transition: 'all 0.2s'
                            }}
                        >
                            <i data-lucide="shield-check" style={{ width: '16px', height: '16px' }}></i>
                            Yönetici Giriş Paneli &rarr;
                        </a>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<UserLoginApp />, document.getElementById('root'));
    </script>
</body>
</html>
