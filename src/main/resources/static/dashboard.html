<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Belge Duyuru & Bildirim Paneli (Super Admin Dashboard)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React 18 & Babel & Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-hover: rgba(31, 41, 55, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(59, 130, 246, 0.3);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .container { max-width: 1360px; margin: 0 auto; }

        /* Navbar Layout */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 19px;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c084fc;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 600;
            height: 38px;
            white-space: nowrap;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
            height: 38px;
            padding: 0 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 0 12px;
            height: 38px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .btn-scrape {
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            color: white;
            border: none;
            height: 38px;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-scrape:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-scrape:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .stat-card:hover { border-color: var(--border-glow); transform: translateY(-2px); }

        .stat-info .title { font-size: 13px; color: var(--text-sub); font-weight: 600; }
        .stat-info .value { font-size: 26px; font-weight: 800; color: white; margin-top: 4px; }

        .stat-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Layout Main Content */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 370px;
            gap: 24px;
        }

        @media (max-width: 992px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .content-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 16px 10px 40px;
            color: white;
            outline: none;
            font-size: 13.5px;
        }

        .search-input:focus { border-color: var(--primary); }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            width: 18px;
            height: 18px;
        }

        .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }

        .pill {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .pill.active, .pill:hover {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.4);
        }

        /* Announcement Cards */
        .announcement-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .announcement-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--primary), var(--accent-cyan));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .announcement-card:hover {
            border-color: var(--border-glow);
            background: var(--card-hover);
        }

        .announcement-card:hover::before { opacity: 1; }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .site-badge {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-date {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title-text {
            font-size: 15.5px;
            font-weight: 700;
            color: white;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .card-body-text {
            font-size: 13.5px;
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer { display: flex; gap: 12px; align-items: center; }

        .btn-link {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-pdf {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-pdf:hover { background: rgba(239, 68, 68, 0.25); }

        .btn-source {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
        }

        .btn-source:hover { color: white; background: rgba(255, 255, 255, 0.1); }

        /* Pagination Controls */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding: 12px 0;
        }

        .page-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            height: 34px;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Sidebar Panels */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }

        .side-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
        }

        .side-title {
            font-size: 15.5px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; letter-spacing: 0.3px; }
        
        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: white;
            font-size: 13.5px;
            outline: none;
        }

        .input-field:focus { border-color: var(--primary); }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            color: white;
            border: none;
            height: 38px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-submit:hover { opacity: 0.9; }

        /* Fixed Single-Line Subscriber Action Buttons & Preferences */
        .sub-list { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }

        .sub-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .sub-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .sub-info {
            min-width: 0;
            flex: 1;
        }

        .sub-info .name {
            font-size: 13px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .sub-info .mail {
            font-size: 11.5px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .sub-site-badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .sub-site-pill {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .sub-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn-sub-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 30px;
            padding: 0 10px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .btn-sub-pref {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border-color: rgba(139, 92, 246, 0.35);
        }

        .btn-sub-pref:hover { background: rgba(139, 92, 246, 0.25); }

        .btn-sub-unsub {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.35);
        }

        .btn-sub-unsub:hover { background: rgba(245, 158, 11, 0.25); }

        .btn-sub-activate {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.35);
        }

        .btn-sub-activate:hover { background: rgba(16, 185, 129, 0.25); }

        .btn-sub-del {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.35);
        }

        .btn-sub-del:hover { background: rgba(239, 68, 68, 0.25); }

        /* Modal Overlay for Site Preferences */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease-out;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--success);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13.5px;
            font-weight: 600;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const getAuthHeader = () => {
            const token = localStorage.getItem('adminToken');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        };

        const authFetch = async (url, options = {}) => {
            const headers = {
                'Content-Type': 'application/json',
                ...getAuthHeader(),
                ...(options.headers || {})
            };
            try {
                const res = await fetch(url, { ...options, headers });
                if (res.status === 401) {
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('adminUser');
                    window.location.href = '/admin-login.html';
                }
                return res;
            } catch (err) {
                console.error("Fetch error:", err);
                return { ok: false, status: 500, json: async () => ({ success: false, message: 'Sunucu ile bağlantı kurulamadı.' }) };
            }
        };

        // --- Modular React Component Definitions ---

        function StatCard({ title, value, subtext, icon, color, bg }) {
            return (
                <div class="stat-card">
                    <div class="stat-info">
                        <div class="title">{title}</div>
                        <div class="value">{value}</div>
                        {subtext && <div style={{fontSize: '11px', color: 'var(--text-sub)', marginTop: '4px'}}>{subtext}</div>}
                    </div>
                    <div class="stat-icon" style={{ background: bg, color: color }}>
                        <i data-lucide={icon}></i>
                    </div>
                </div>
            );
        }

        function AnnouncementCard({ item }) {
            return (
                <div class="announcement-card">
                    <div class="card-top">
                        <span class="site-badge">{item.sourceSiteDisplayName || 'e-Belge GİB'}</span>
                        <span class="card-date">
                            <i data-lucide="calendar" style={{width: '14px', height: '14px'}}></i>
                            {item.announcementDate ? new Date(item.announcementDate).toLocaleDateString('tr-TR') : 'Tarih Belirtilmemiş'}
                        </span>
                    </div>
                    <div class="card-title-text">{item.title}</div>
                    <div class="card-body-text">{item.content}</div>
                    <div class="card-footer">
                        {item.attachmentUrl && (
                            <a href={item.attachmentUrl} target="_blank" class="btn-link btn-pdf">
                                <i data-lucide="file-text" style={{width: '14px', height: '14px'}}></i>
                                Ek Dosyayı İndir
                            </a>
                        )}
                        {item.sourceUrl && (
                            <a href={item.sourceUrl} target="_blank" class="btn-link btn-source">
                                <i data-lucide="external-link" style={{width: '14px', height: '14px'}}></i>
                                Resmi Kaynağa Git
                            </a>
                        )}
                    </div>
                </div>
            );
        }

        function SubscriberItem({ sub, availableSites, onToggleStatus, onDelete, onEditPreferences }) {
            const prefSiteNames = (sub.subscribedSites || []).map(siteKey => {
                const found = availableSites.find(s => s.name === siteKey);
                return found ? found.displayName : siteKey;
            });

            const effectiveSiteNames = (sub.effectiveSites || []).map(siteKey => {
                const found = availableSites.find(s => s.name === siteKey);
                return found ? found.displayName : siteKey;
            });

            return (
                <div class="sub-item" style={{ opacity: sub.active ? 1 : 0.7 }}>
                    <div class="sub-header-row">
                        <div class="sub-info">
                            <div class="name">
                                <span>{sub.fullName || sub.email}</span>
                                <span style={{
                                    fontSize: '10px', 
                                    padding: '2px 6px', 
                                    borderRadius: '8px', 
                                    background: sub.active ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)', 
                                    color: sub.active ? '#34d399' : '#f87171', 
                                    fontWeight: '700'
                                }}>
                                    {sub.active ? 'Aktif' : 'İptal'}
                                </span>
                            </div>
                            <div class="mail">{sub.email}</div>
                        </div>
                    </div>

                    {/* Department Badges */}
                    <div style={{display: 'flex', flexWrap: 'wrap', gap: '5px', marginTop: '6px', marginBottom: '6px'}}>
                        {sub.isGeneralEmployee || !sub.departments || sub.departments.length === 0 ? (
                            <span style={{fontSize: '10.5px', background: 'rgba(56,189,248,0.15)', color: '#38bdf8', padding: '2px 8px', borderRadius: '8px', fontWeight: '700', border: '1px solid rgba(56,189,248,0.35)'}}>
                                🌐 Genel Çalışan (Tüm Kaynaklar)
                            </span>
                        ) : (
                            sub.departments.map(dept => (
                                <span key={dept.id} style={{fontSize: '10.5px', background: 'rgba(139,92,246,0.18)', color: '#c084fc', padding: '2px 8px', borderRadius: '8px', fontWeight: '700', border: '1px solid rgba(139,92,246,0.35)'}}>
                                    🏢 {dept.name}
                                </span>
                            ))
                        )}
                    </div>

                    {/* Preferred Site Badges */}
                    <div class="sub-site-badges">
                        <span style={{fontSize: '10.5px', color: 'var(--text-sub)', marginRight: '4px'}}>Kişisel Tercihler:</span>
                        {prefSiteNames.length > 0 ? (
                            prefSiteNames.map(name => (
                                <span key={name} class="sub-site-pill">{name}</span>
                            ))
                        ) : (
                            <span style={{fontSize: '10px', color: '#94a3b8'}}>Yok</span>
                        )}
                    </div>

                    {/* Dynamic Effective Scope Display */}
                    {!sub.isGeneralEmployee && (
                        <div style={{fontSize: '11px', color: '#38bdf8', background: 'rgba(15, 23, 42, 0.6)', padding: '5px 9px', borderRadius: '6px', marginTop: '6px', border: '1px solid rgba(56, 189, 248, 0.2)'}}>
                            <b>Duyuru Kapsamı:</b> {effectiveSiteNames.length > 0 ? effectiveSiteNames.join(', ') : 'Hiçbiri (0 site)'}
                        </div>
                    )}

                    <div class="sub-actions" style={{marginTop: '10px'}}>
                        <button 
                            class="btn-sub-action btn-sub-pref"
                            onClick={() => onEditPreferences(sub)}
                            title="Abone Tercih ve Departmanlarını Düzenle"
                        >
                            <i data-lucide="sliders" style={{width: '13px', height: '13px'}}></i>
                            Düzenle
                        </button>
                        <button 
                            class={`btn-sub-action ${sub.active ? 'btn-sub-unsub' : 'btn-sub-activate'}`} 
                            onClick={() => onToggleStatus(sub.id, sub.active)} 
                            title={sub.active ? "Aboneliği İptal Et (Pasife Al)" : "Aboneliği Yeniden Aktif Et"}
                        >
                            <i data-lucide={sub.active ? "user-x" : "user-check"} style={{width: '13px', height: '13px'}}></i>
                            {sub.active ? 'İptal Et' : 'Aktif Et'}
                        </button>
                        <button 
                            class="btn-sub-action btn-sub-del" 
                            onClick={() => onDelete(sub)} 
                            title="Aboneyi Sil"
                        >
                            <i data-lucide="trash-2" style={{width: '13px', height: '13px'}}></i>
                            Sil
                        </button>
                    </div>
                </div>
            );
        }

        function Pagination({ currentPage, totalPages, onPageChange }) {
            if (totalPages <= 1) return null;
            return (
                <div class="pagination">
                    <button class="page-btn" disabled={currentPage === 0} onClick={() => onPageChange(currentPage - 1)}>
                        <i data-lucide="chevron-left" style={{width: '14px', height: '14px'}}></i> Önceki
                    </button>
                    <span style={{fontSize: '12.5px', color: '#9ca3af', fontWeight: '500'}}>Sayfa {currentPage + 1} / {totalPages}</span>
                    <button class="page-btn" disabled={currentPage >= totalPages - 1} onClick={() => onPageChange(currentPage + 1)}>
                        Sonraki <i data-lucide="chevron-right" style={{width: '14px', height: '14px'}}></i>
                    </button>
                </div>
            );
        }

        function Navbar({ currentUser, scrapeMinutes, isCustomMode, customMinutesInput, onUpdateInterval, onCustomInputSubmit, onCustomInputChange, onToggleCustomMode, scraping, onScrape, onLogout }) {
            return (
                <div class="navbar">
                    <div class="brand">
                        <div class="brand-icon">
                            <i data-lucide="bell" style={{color: 'white', width: '22px', height: '22px'}}></i>
                        </div>
                        <div class="brand-text">
                            <h1>Duyuru Takip Sistemi</h1>
                            <p>Kurumsal Duyuru İzleme Paneli</p>
                        </div>
                    </div>

                    <div class="nav-actions">
                        <div style={{display: 'flex', alignItems: 'center', gap: '8px', background: 'rgba(15, 23, 42, 0.8)', border: '1px solid var(--border-color)', padding: '0 12px', height: '38px', borderRadius: '10px', fontSize: '12.5px', color: 'var(--text-sub)'}}>
                            <i data-lucide="clock" style={{width: '15px', height: '15px', color: '#38bdf8'}}></i>
                            <span style={{fontWeight: '500'}}>Tarama Periyodu:</span>
                            {!isCustomMode ? (
                                <select 
                                    value={scrapeMinutes} 
                                    onChange={(e) => onUpdateInterval(e.target.value)}
                                    style={{background: 'rgba(30, 41, 59, 0.95)', color: '#f9fafb', border: '1px solid rgba(56, 189, 248, 0.4)', borderRadius: '6px', padding: '4px 8px', fontSize: '12.5px', fontWeight: '700', cursor: 'pointer', outline: 'none'}}
                                >
                                    <option value="15">15 Dakika</option>
                                    <option value="20">20 Dakika</option>
                                    <option value="30">30 Dakika</option>
                                    <option value="45">45 Dakika</option>
                                    <option value="60">1 Saat</option>
                                    <option value="120">2 Saat</option>
                                    <option value="180">3 Saat</option>
                                    <option value="360">6 Saat</option>
                                    <option value="720">12 Saat</option>
                                    <option value="1440">24 Saat</option>
                                    <option value="custom">Özel Süre...</option>
                                </select>
                            ) : (
                                <form onSubmit={onCustomInputSubmit} style={{display: 'inline-flex', alignItems: 'center', gap: '6px'}}>
                                    <input 
                                        type="number" 
                                        min="1" 
                                        max="10000"
                                        placeholder="20"
                                        value={customMinutesInput}
                                        onChange={onCustomInputChange}
                                        style={{width: '65px', background: 'rgba(30, 41, 59, 0.95)', color: '#f9fafb', border: '1px solid #38bdf8', borderRadius: '6px', padding: '3px 6px', fontSize: '12px', fontWeight: '700', outline: 'none'}}
                                        autoFocus
                                    />
                                    <span style={{fontSize: '11px', color: '#94a3b8'}}>dk</span>
                                    <button type="submit" title="Kaydet" style={{background: '#10b981', color: 'white', border: 'none', borderRadius: '6px', padding: '3px 7px', fontSize: '11px', fontWeight: '600', cursor: 'pointer'}}>✓</button>
                                    <button type="button" title="Vazgeç" onClick={() => onToggleCustomMode(false)} style={{background: 'rgba(239, 68, 68, 0.2)', color: '#f87171', border: '1px solid rgba(239, 68, 68, 0.4)', borderRadius: '6px', padding: '3px 7px', fontSize: '11px', cursor: 'pointer'}}>✕</button>
                                </form>
                            )}
                        </div>

                        <div class="status-tag">
                            <div class="pulse-dot"></div>
                            Sistem Aktif
                        </div>

                        <button class="btn-scrape" onClick={onScrape} disabled={scraping}>
                            <i data-lucide={scraping ? "loader" : "refresh-cw"} class={scraping ? "spin" : ""}></i>
                            {scraping ? 'Taranıyor...' : 'Tarama Başlat'}
                        </button>

                        <div class="admin-profile">
                            <div class="admin-badge">
                                <i data-lucide="shield-check" style={{width: '15px', height: '15px'}}></i>
                                <span><b>{currentUser?.fullName || currentUser?.username || 'Super Admin'}</b></span>
                            </div>
                            <button class="btn-logout" onClick={onLogout} title="Oturumu Kapat">
                                <i data-lucide="log-out" style={{width: '14px', height: '14px'}}></i> Çıkış Yap
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Main Dashboard Application
        function DashboardApp() {
            const [currentUser, setCurrentUser] = useState(JSON.parse(localStorage.getItem('adminUser') || 'null'));
            const [sites, setSites] = useState([]); // Dynamic sites fetched from GET /api/v1/sites
            const [announcements, setAnnouncements] = useState([]);
            const [subscribers, setSubscribers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [scraping, setScraping] = useState(false);
            const [search, setSearch] = useState('');
            const [filter, setFilter] = useState('ALL');
            const [page, setPage] = useState(0);
            const [totalPages, setTotalPages] = useState(0);
            const [totalElements, setTotalElements] = useState(0);

            // Subscriber Search & Pagination state
            const [subSearch, setSubSearch] = useState('');
            const [subPage, setSubPage] = useState(0);
            const SUB_PER_PAGE = 5;

            // New Subscriber Form State
            const [fullName, setFullName] = useState('');
            const [email, setEmail] = useState('');
            const [selectedNewSubSites, setSelectedNewSubSites] = useState([]);
            const [selectedExcelSites, setSelectedExcelSites] = useState([]);

            // Preferences Modal Editing State
            const [editingSub, setEditingSub] = useState(null);
            const [editingSites, setEditingSites] = useState([]);
            const [editingSubDepts, setEditingSubDepts] = useState([]);
            const [deletingSub, setDeletingSub] = useState(null);

            // Department Management State
            const [departments, setDepartments] = useState([]);
            const [selectedNewSubDepts, setSelectedNewSubDepts] = useState([]);
            const [deptName, setDeptName] = useState('');
            const [deptDescription, setDeptDescription] = useState('');
            const [selectedDeptSites, setSelectedDeptSites] = useState([]);
            const [editingDept, setEditingDept] = useState(null);
            const [viewingDeptSubscribers, setViewingDeptSubscribers] = useState(null);
            const [deptSubscribersList, setDeptSubscribersList] = useState([]);

            useEffect(() => {
                if (deletingSub || editingSub || editingDept || viewingDeptSubscribers) {
                    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
                }
            }, [deletingSub, editingSub, editingDept, viewingDeptSubscribers]);

            // Settings & Toasts state
            const [scrapeMinutes, setScrapeMinutes] = useState(60);
            const [isCustomMode, setIsCustomMode] = useState(false);
            const [customMinutesInput, setCustomMinutesInput] = useState('');
            const [toasts, setToasts] = useState([]);

            const showToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            };

            const fetchDepartments = async () => {
                try {
                    const res = await authFetch('/api/v1/departments');
                    const data = await res.json();
                    if (data.success) {
                        setDepartments(data.data || []);
                    }
                } catch (err) {
                    console.error("Fetch departments error:", err);
                }
            };

            const handleCreateDepartment = async (e) => {
                e.preventDefault();
                if (!deptName.trim()) return;
                try {
                    const res = await authFetch('/api/v1/departments', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: deptName,
                            description: deptDescription,
                            siteTypes: selectedDeptSites
                        })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        showToast('Departman oluşturuldu.');
                        setDeptName('');
                        setDeptDescription('');
                        setSelectedDeptSites([]);
                        fetchDepartments();
                    } else {
                        showToast(data.message || 'Departman oluşturulamadı.', 'danger');
                    }
                } catch (err) {
                    showToast('İşlem gerçekleştirilemedi.', 'danger');
                }
            };

            const handleUpdateDepartment = async (e) => {
                e.preventDefault();
                if (!editingDept) return;
                try {
                    const res = await authFetch(`/api/v1/departments/${editingDept.id}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            name: editingDept.name,
                            description: editingDept.description,
                            siteTypes: editingDept.sites || []
                        })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        showToast('Departman güncellendi.');
                        setEditingDept(null);
                        fetchDepartments();
                        fetchSubscribers();
                    } else {
                        showToast(data.message || 'Güncelleme yapılamadı.', 'danger');
                    }
                } catch (err) {
                    showToast('İşlem gerçekleştirilemedi.', 'danger');
                }
            };

            const handleDeleteDepartment = async (id, name) => {
                if (!confirm(`'${name}' departmanını silmek istediğinize emin misiniz?`)) return;
                try {
                    const res = await authFetch(`/api/v1/departments/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        showToast('Departman silindi.');
                        fetchDepartments();
                        fetchSubscribers();
                    }
                } catch (err) {
                    showToast('Silme işlemi başarısız.', 'danger');
                }
            };

            const handleViewDeptSubscribers = async (dept) => {
                setViewingDeptSubscribers(dept);
                try {
                    const res = await authFetch(`/api/v1/departments/${dept.id}/subscribers`);
                    const data = await res.json();
                    if (data.success) {
                        setDeptSubscribersList(data.data || []);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            // Fetch dynamic site list from API on mount
            const fetchSites = async () => {
                try {
                    const res = await authFetch('/api/v1/sites');
                    const data = await res.json();
                    if (data.success && data.data) {
                        setSites(data.data);
                        // Default new subscriber & excel checkboxes to all available sites
                        setSelectedNewSubSites(data.data.map(s => s.name));
                        setSelectedExcelSites(data.data.map(s => s.name));
                    }
                } catch (err) {
                    console.error("Fetch sites error:", err);
                }
            };

            // Verify session on mount
            useEffect(() => {
                const verifySession = async () => {
                    try {
                        const res = await authFetch('/api/v1/auth/me');
                        const data = await res.json();
                        if (data.success && data.data) {
                            setCurrentUser(data.data);
                            localStorage.setItem('adminUser', JSON.stringify(data.data));
                        } else {
                            window.location.href = '/login.html';
                        }
                    } catch (err) {
                        window.location.href = '/login.html';
                    }
                };
                verifySession();
            }, []);

            const fetchAnnouncements = async (pageNo = 0) => {
                setLoading(true);
                try {
                    const res = await authFetch(`/api/v1/announcements?page=${pageNo}&size=10`);
                    const data = await res.json();
                    if (data.success && data.data) {
                        setAnnouncements(data.data.content || []);
                        setTotalPages(data.data.totalPages || 0);
                        setTotalElements(data.data.totalElements || 0);
                        setPage(data.data.number || 0);
                    }
                } catch (err) {
                    console.error("Fetch error:", err);
                } finally {
                    setLoading(false);
                }
            };

            const fetchSubscribers = async () => {
                try {
                    const res = await authFetch('/api/v1/subscribers');
                    const data = await res.json();
                    if (data.success) {
                        setSubscribers(data.data || []);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const fetchSettings = async () => {
                try {
                    const res = await authFetch('/api/v1/settings/scrape');
                    const data = await res.json();
                    if (data.success && data.data) {
                        const mins = data.data.intervalMinutes || 60;
                        setScrapeMinutes(mins);
                        const standardValues = [15, 20, 30, 45, 60, 120, 180, 360, 720, 1440];
                        if (!standardValues.includes(mins)) {
                            setIsCustomMode(true);
                            setCustomMinutesInput(String(mins));
                        }
                    }
                } catch (err) {
                    console.error("Fetch settings error:", err);
                }
            };

            const handleUpdateIntervalMinutes = async (mins) => {
                if (mins === 'custom') {
                    setIsCustomMode(true);
                    setCustomMinutesInput(String(scrapeMinutes));
                    return;
                }
                const newMins = parseInt(mins, 10);
                if (isNaN(newMins) || newMins < 1) return;

                setScrapeMinutes(newMins);
                setIsCustomMode(false);
                try {
                    const res = await authFetch(`/api/v1/settings/scrape?intervalMinutes=${newMins}`, { method: 'POST' });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        showToast('Tarama periyodu güncellendi.');
                    } else {
                        showToast(data.message || 'Ayar güncellenemedi.', 'danger');
                    }
                } catch (err) {
                    showToast('İşlem gerçekleştirilemedi.', 'danger');
                }
            };

            const handleSaveCustomMinutes = (e) => {
                e.preventDefault();
                handleUpdateIntervalMinutes(customMinutesInput);
            };

            useEffect(() => {
                const token = localStorage.getItem('adminToken');
                if (!token) {
                    window.location.href = '/admin-login.html';
                    return;
                }
                fetchSites();
                fetchAnnouncements();
                fetchSubscribers();
                fetchDepartments();
                fetchSettings();
            }, []);

            useEffect(() => {
                setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 100);
            }, [subscribers, announcements, loading, subPage, subSearch, sites, departments, editingSub, editingDept, viewingDeptSubscribers]);

            const handleScrape = async () => {
                setScraping(true);
                try {
                    const res = await authFetch('/api/v1/announcements/trigger', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        const count = data.data ? data.data.length : 0;
                        if (count > 0) {
                            showToast(`Tarama tamamlandı. ${count} yeni duyuru bulundu.`);
                        } else {
                            showToast('Tarama tamamlandı.');
                        }
                        fetchAnnouncements(0);
                    }
                } catch (err) {
                    showToast('Tarama tamamlanamadı.', 'danger');
                } finally {
                    setScraping(false);
                }
            };

            const handleAddSubscriber = async (e) => {
                e.preventDefault();
                if (!email) return;
                try {
                    const res = await authFetch('/api/v1/subscribers', {
                        method: 'POST',
                        body: JSON.stringify({ 
                            fullName, 
                            email, 
                            subscribedSites: selectedNewSubSites,
                            departmentIds: selectedNewSubDepts
                        })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        showToast('Abone oluşturuldu.');
                        setFullName('');
                        setEmail('');
                        setSelectedNewSubSites(sites.map(s => s.name)); // Reset to all
                        setSelectedNewSubDepts([]); // Reset departments
                        fetchSubscribers();
                        fetchDepartments();
                    } else {
                        showToast(data.message || 'Abone oluşturulamadı.', 'danger');
                    }
                } catch (err) {
                    showToast('İşlem gerçekleştirilemedi.', 'danger');
                }
            };

            const handleOpenDeleteModal = (sub) => {
                setDeletingSub(sub);
            };

            const confirmDeleteSubscriber = async (id) => {
                try {
                    await authFetch(`/api/v1/subscribers/${id}`, { method: 'DELETE' });
                    showToast('Abone silindi.');
                    setDeletingSub(null);
                    fetchSubscribers();
                    fetchDepartments();
                } catch (err) {
                    showToast('Silme işlemi başarısız.', 'danger');
                }
            };

            const handleToggleSubscriberStatus = async (id, currentActive) => {
                const newActive = !currentActive;
                try {
                    const res = await authFetch(`/api/v1/subscribers/${id}/status?active=${newActive}`, { method: 'PATCH' });
                    if (res.ok) {
                        showToast(newActive ? 'Abone aktifleştirildi.' : 'Abone pasifleştirildi.');
                        fetchSubscribers();
                    }
                } catch (err) {
                    showToast('Durum güncellenemedi.', 'danger');
                }
            };

            const handleOpenEditPreferences = (sub) => {
                setEditingSub(sub);
                setEditingSites(sub.subscribedSites || []);
                setEditingSubDepts(sub.departments ? sub.departments.map(d => d.id) : []);
            };

            const handleSavePreferences = async () => {
                if (!editingSub) return;
                try {
                    const resSites = await authFetch(`/api/v1/subscribers/${editingSub.id}/sites`, {
                        method: 'PATCH',
                        body: JSON.stringify(editingSites)
                    });
                    
                    const resDepts = await authFetch(`/api/v1/subscribers/${editingSub.id}/departments`, {
                        method: 'PATCH',
                        body: JSON.stringify(editingSubDepts)
                    });

                    if (resSites.ok && resDepts.ok) {
                        showToast('Abone güncellendi.');
                        setEditingSub(null);
                        fetchSubscribers();
                        fetchDepartments();
                    } else {
                        showToast('Güncelleme başarısız.', 'danger');
                    }
                } catch (err) {
                    showToast('İşlem gerçekleştirilemedi.', 'danger');
                }
            };

            const handleExcelUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                const sitesQuery = selectedExcelSites.map(s => `sites=${encodeURIComponent(s)}`).join('&');
                const uploadUrl = '/api/v1/subscribers/upload-excel' + (sitesQuery ? `?${sitesQuery}` : '');

                try {
                    const token = localStorage.getItem('adminToken');
                    const res = await fetch(uploadUrl, {
                        method: 'POST',
                        headers: token ? { 'Authorization': `Bearer ${token}` } : {},
                        body: formData
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        showToast('Aboneler içe aktarıldı.');
                        fetchSubscribers();
                    } else {
                        showToast(data.message || 'İçe aktarma başarısız.', 'danger');
                    }
                } catch (err) {
                    showToast('İşlem gerçekleştirilemedi.', 'danger');
                }
                e.target.value = '';
            };

            const handleLogout = async () => {
                try {
                    await authFetch('/api/v1/auth/logout', { method: 'POST' });
                } catch (ignored) {}
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminUser');
                window.location.href = '/login.html';
            };

            // Dynamic filter logic
            const filteredAnnouncements = announcements.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(search.toLowerCase()) || 
                                     item.content.toLowerCase().includes(search.toLowerCase());
                if (!matchesSearch) return false;

                if (filter === 'HAS_PDF') return !!item.attachmentUrl;
                if (filter !== 'ALL' && filter !== 'HAS_PDF' && filter !== 'TODAY') {
                    return item.sourceSite === filter;
                }
                if (filter === 'TODAY') {
                    const todayStr = new Date().toISOString().split('T')[0];
                    return item.announcementDate === todayStr;
                }
                return true;
            });

            // Subscriber filter & pagination logic
            const filteredSubscribers = subscribers.filter(sub => {
                const q = subSearch.toLowerCase();
                return (sub.fullName && sub.fullName.toLowerCase().includes(q)) || 
                       (sub.email && sub.email.toLowerCase().includes(q));
            });
            const totalSubPages = Math.ceil(filteredSubscribers.length / SUB_PER_PAGE) || 1;
            const paginatedSubscribers = filteredSubscribers.slice(subPage * SUB_PER_PAGE, (subPage + 1) * SUB_PER_PAGE);

            return (
                <div class="container">
                    {/* Modular Navbar Header */}
                    <Navbar 
                        currentUser={currentUser}
                        scrapeMinutes={scrapeMinutes}
                        isCustomMode={isCustomMode}
                        customMinutesInput={customMinutesInput}
                        onUpdateInterval={handleUpdateIntervalMinutes}
                        onCustomInputSubmit={handleSaveCustomMinutes}
                        onCustomInputChange={(e) => setCustomMinutesInput(e.target.value)}
                        onToggleCustomMode={setIsCustomMode}
                        scraping={scraping}
                        onScrape={handleScrape}
                        onLogout={handleLogout}
                    />

                    {/* Modular Stats Grid */}
                    <div class="stats-grid">
                        <StatCard 
                            title="Toplam Duyuru" 
                            value={totalElements} 
                            icon="file-text" 
                            color="#3b82f6" 
                            bg="rgba(59, 130, 246, 0.15)" 
                        />
                        <StatCard 
                            title="Aktif Aboneler" 
                            value={subscribers.filter(s => s.active).length} 
                            icon="users" 
                            color="#10b981" 
                            bg="rgba(16, 185, 129, 0.15)" 
                        />
                        <StatCard 
                            title="Departmanlar" 
                            value={`${departments.length} Departman`}
                            subtext={departments.map(d => d.name).join(' • ') || ''} 
                            icon="building" 
                            color="#8b5cf6" 
                            bg="rgba(139, 92, 246, 0.15)" 
                        />
                    </div>

                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Açıklama</label>
                                        <input 
                                            type="text" 
                                            class="input-field" 
                                            value={editingDept.description || ''}
                                            onChange={(e) => setEditingDept({ ...editingDept, description: e.target.value })}
                                        />
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">İlişkili Kaynaklar</label>
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '8px', background: 'rgba(15, 23, 42, 0.7)', padding: '12px', borderRadius: '10px', border: '1px solid var(--border-color)'}}>
                                            {sites.map(s => (
                                                <label key={s.name} style={{display: 'flex', alignItems: 'center', gap: '8px', fontSize: '13px', cursor: 'pointer', color: '#e2e8f0', userSelect: 'none'}}>
                                                    <input 
                                                        type="checkbox" 
                                                        checked={(editingDept.sites || []).includes(s.name)}
                                                        onChange={(e) => {
                                                            const current = editingDept.sites || [];
                                                            if (e.target.checked) {
                                                                setEditingDept({ ...editingDept, sites: [...current, s.name] });
                                                            } else {
                                                                setEditingDept({ ...editingDept, sites: current.filter(n => n !== s.name) });
                                                            }
                                                        }}
                                                        style={{width: '15px', height: '15px', accentColor: 'var(--accent-purple)', cursor: 'pointer'}}
                                                    />
                                                    <span>{s.displayName}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    <div style={{display: 'flex', gap: '10px', justifyContent: 'flex-end', marginTop: '20px'}}>
                                        <button 
                                            type="button"
                                            onClick={() => setEditingDept(null)}
                                            style={{background: 'rgba(255,255,255,0.05)', color: '#94a3b8', border: '1px solid var(--border-color)', padding: '8px 16px', borderRadius: '8px', cursor: 'pointer', fontSize: '12.5px', fontWeight: '600'}}
                                        >
                                            İptal
                                        </button>
                                        <button 
                                            type="submit"
                                            style={{background: 'linear-gradient(135deg, var(--accent-purple), #7c3aed)', color: 'white', border: 'none', padding: '8px 18px', borderRadius: '8px', cursor: 'pointer', fontSize: '12.5px', fontWeight: '700'}}
                                        >
                                            Kaydet
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Department Subscribers View Modal */}
                    {viewingDeptSubscribers && (
                        <div class="modal-overlay" onClick={() => setViewingDeptSubscribers(null)}>
                            <div class="modal-card" onClick={(e) => e.stopPropagation()} style={{maxWidth: '480px'}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px'}}>
                                    <h3 style={{fontSize: '16px', fontWeight: '700', color: 'white', display: 'flex', alignItems: 'center', gap: '8px'}}>
                                        🏢 {viewingDeptSubscribers.name} Abone Listesi
                                    </h3>
                                    <button onClick={() => setViewingDeptSubscribers(null)} style={{background: 'none', border: 'none', color: '#94a3b8', fontSize: '18px', cursor: 'pointer'}}>✕</button>
                                </div>

                                <div style={{maxHeight: '300px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '16px'}}>
                                    {deptSubscribersList.length === 0 ? (
                                        <div style={{fontSize: '12.5px', color: '#94a3b8', textAlign: 'center', padding: '20px'}}>
                                            Abone bulunmuyor.
                                        </div>
                                    ) : (
                                        deptSubscribersList.map(s => (
                                            <div key={s.id} style={{background: 'rgba(15, 23, 42, 0.6)', padding: '10px 14px', borderRadius: '10px', border: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                <div>
                                                    <div style={{fontSize: '13px', fontWeight: '700', color: 'white'}}>{s.fullName || s.email}</div>
                                                    <div style={{fontSize: '11.5px', color: '#94a3b8'}}>{s.email}</div>
                                                </div>
                                                <span style={{fontSize: '10px', background: s.active ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)', color: s.active ? '#34d399' : '#f87171', padding: '2px 8px', borderRadius: '6px', fontWeight: '700'}}>
                                                    {s.active ? 'Aktif' : 'Pasif'}
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <div style={{display: 'flex', justifyContent: 'flex-end'}}>
                                    <button 
                                        onClick={() => setViewingDeptSubscribers(null)}
                                        style={{background: 'rgba(255,255,255,0.08)', color: 'white', border: '1px solid var(--border-color)', padding: '8px 18px', borderRadius: '8px', cursor: 'pointer', fontSize: '12.5px', fontWeight: '600'}}
                                    >
                                        Kapat
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Subscriber Deletion Confirmation Modal */}
                    {deletingSub && (
                        <div class="modal-overlay" onClick={() => setDeletingSub(null)}>
                            <div class="modal-card" onClick={(e) => e.stopPropagation()} style={{maxWidth: '420px', textAlign: 'center'}}>
                                <div style={{
                                    width: '56px', 
                                    height: '56px', 
                                    borderRadius: '50%', 
                                    background: 'rgba(239, 68, 68, 0.15)', 
                                    color: '#ef4444', 
                                    display: 'flex', 
                                    alignItems: 'center', 
                                    justifyContent: 'center', 
                                    margin: '0 auto 16px auto',
                                    border: '1px solid rgba(239, 68, 68, 0.3)'
                                }}>
                                    <i data-lucide="trash-2" style={{width: '26px', height: '26px'}}></i>
                                </div>
                                
                                <h3 style={{fontSize: '18px', fontWeight: '700', color: 'white', marginBottom: '8px'}}>
                                    Abone Sil
                                </h3>
                                
                                <p style={{fontSize: '13.5px', color: '#94a3b8', lineHeight: '1.5', marginBottom: '24px'}}>
                                    <strong style={{color: '#f3f4f6'}}>{deletingSub.fullName || deletingSub.email}</strong> abonesini silmek istediğinize emin misiniz?
                                </p>

                                <div style={{display: 'flex', gap: '12px', justifyContent: 'center'}}>
                                    <button 
                                        onClick={() => setDeletingSub(null)}
                                        style={{
                                            flex: 1,
                                            background: 'rgba(255,255,255,0.06)', 
                                            color: '#cbd5e1', 
                                            border: '1px solid var(--border-color)', 
                                            padding: '10px 16px', 
                                            borderRadius: '10px', 
                                            cursor: 'pointer', 
                                            fontSize: '13px', 
                                            fontWeight: '600'
                                        }}
                                    >
                                        İptal
                                    </button>
                                    <button 
                                        onClick={() => confirmDeleteSubscriber(deletingSub.id)}
                                        style={{
                                            flex: 1,
                                            background: 'linear-gradient(135deg, #ef4444, #dc2626)', 
                                            color: 'white', 
                                            border: 'none', 
                                            padding: '10px 16px', 
                                            borderRadius: '10px', 
                                            cursor: 'pointer', 
                                            fontSize: '13px', 
                                            fontWeight: '700',
                                            boxShadow: '0 4px 12px rgba(239, 68, 68, 0.35)'
                                        }}
                                    >
                                        Sil
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification Container */}
                    <div class="toast-container">
                        {toasts.map(t => (
                            <div key={t.id} class="toast" style={{borderColor: t.type === 'danger' ? '#ef4444' : '#10b981'}}>
                                <i data-lucide={t.type === 'danger' ? 'alert-circle' : 'check-circle-2'} style={{color: t.type === 'danger' ? '#ef4444' : '#10b981'}}></i>
                                {t.message}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<DashboardApp />, document.getElementById('root'));

        // Refresh icons on mount/update
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 100);
    </script>
</body>
</html>
