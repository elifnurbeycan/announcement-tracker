server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: announcement-tracker
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/announcement-tracker-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/announcement-tracker-realm/protocol/openid-connect/certs}
  
  # PostgreSQL Datasource Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/announcement_tracker_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

announcement:
  tracker:
    cron: "${ANNOUNCEMENT_CRON:0 0 * * * *}"
    enabled: ${ANNOUNCEMENT_SCHEDULER_ENABLED:true}
    app-base-url: ${APP_BASE_URL:http://localhost:8080}
    email:
      from: ${MAIL_FROM:noreply@announcementtracker.com}
      default-recipient: ${DEFAULT_RECIPIENT:admin@example.com}

keycloak:
  auth-server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:announcement-tracker-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:announcement-tracker-app}


